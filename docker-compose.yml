services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ubergooranda
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ubergooranda"]
      interval: 5s

  api:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD}@db/ubergooranda
      JWT_SECRET: ${JWT_SECRET}
    expose: ["8000"]

  nginx:
    image: nginx:alpine
    restart: always
    ports: ["8080:8080", "8443:8443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot
    depends_on: [api]
